        <div class="admin-main">
            <header class="admin-topbar">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
                <div class="topbar-left"><h1 class="page-title">Leadership</h1></div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm" id="add-leader-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Leader
                    </button>
                    <div class="user-menu">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-info">
                            <span class="user-name" id="user-name">Admin</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="admin-content">
                <div class="admin-grid" id="leaders-grid" aria-live="polite">
                    <div class="skeleton-card"><div class="skeleton skeleton-image" style="aspect-ratio:1;"></div><div class="skeleton skeleton-text" style="width:60%;margin-top:12px;"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-image" style="aspect-ratio:1;"></div><div class="skeleton skeleton-text" style="width:50%;margin-top:12px;"></div></div>
                </div>

                <div class="empty-state" id="leaders-empty" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2 L15 8 L22 9 L17 14 L18 21 L12 18 L6 21 L7 14 L2 9 L9 8 Z"/></svg>
                    <h3>No Leaders Yet</h3>
                    <p>Add staff members to the leadership team — they will appear on the public About page.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- ADD / EDIT LEADER MODAL -->
    <div class="modal-container" id="leader-modal" aria-hidden="true">
        <div class="modal-overlay" data-close="true"></div>
        <div class="modal modal-lg">
            <button class="modal-close" data-close="true" aria-label="Close">×</button>
            <div class="modal-header">
                <h3 class="modal-title" id="leader-modal-title">Add Leader</h3>
            </div>
            <div class="modal-body">
                <form id="leader-form" novalidate>
                    <div class="form-grid">
                        <div class="form-group" id="staff-select-group">
                            <label for="leader-staff" class="form-label">Staff Member *</label>
                            <select id="leader-staff" class="form-select">
                                <option value="">Select staff member</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="leader-order" class="form-label">Display Order</label>
                            <input type="number" id="leader-order" class="form-input" value="1" min="1">
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label for="leader-title" class="form-label">Leadership Title *</label>
                            <input type="text" id="leader-title" class="form-input" placeholder="e.g. Founder & CEO">
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label for="leader-bio" class="form-label">Short Bio</label>
                            <textarea id="leader-bio" class="form-textarea" rows="3" placeholder="One or two sentences shown on the About page"></textarea>
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label for="leader-photo" class="form-label">Photo (jpg/png/webp, max 2MB)</label>
                            <input type="file" id="leader-photo" accept="image/jpeg,image/png,image/webp" class="form-input">
                            <div style="margin-top:12px;">
                                <img id="leader-photo-preview" alt="Photo preview" style="width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--color-border);display:none;">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-close="true">Cancel</button>
                <button class="btn btn-primary" id="leader-save-btn"><span class="btn-text">Save Leader</span></button>
            </div>
        </div>
    </div>

    <div class="modal-container" id="modal-container" aria-hidden="true"></div>
    <div class="mobile-overlay" id="mobile-overlay"></div>
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
