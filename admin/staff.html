        <!-- MAIN CONTENT -->
        <div class="admin-main">
            <header class="admin-topbar">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-left">
                    <h1 class="page-title">Staff Management</h1>
                </div>
                <div class="topbar-right">
                    <a href="/admin/staff-create.html" class="btn btn-primary btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Staff
                    </a>
                    <div class="user-menu">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-info">
                            <span class="user-name" id="user-name">Admin</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="admin-content">
                <!-- Search & Filters -->
                <div class="content-toolbar">
                    <div class="toolbar-search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input type="search" id="staff-search" class="toolbar-input" placeholder="Search staff by name or ID...">
                    </div>
                    <div class="toolbar-filters">
                        <select id="filter-department" class="toolbar-select">
                            <option value="">All Departments</option>
                            <option value="Executive">Executive</option>
                            <option value="Robotics">Robotics</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Finance">Finance</option>
                            <option value="Innovation">Innovation</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Operations">Operations</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Administration">Administration</option>
                        </select>
                        <select id="filter-status" class="toolbar-select">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <!-- Staff Table -->
                <div class="table-container">
                    <table class="data-table" id="staff-table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Employee ID</th>
                                <th>Department</th>
                                <th>Position</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staff-table-body">
                            <tr class="skeleton-row">
                                <td colspan="7">
                                    <div class="skeleton skeleton-text" style="width: 80%; height: 20px;"></div>
                                </td>
                            </tr>
                            <tr class="skeleton-row">
                                <td colspan="7">
                                    <div class="skeleton skeleton-text" style="width: 70%; height: 20px;"></div>
                                </td>
                            </tr>
                            <tr class="skeleton-row">
                                <td colspan="7">
                                    <div class="skeleton skeleton-text" style="width: 75%; height: 20px;"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="table-pagination" id="table-pagination">
                    <span class="pagination-info" id="pagination-info">Loading...</span>
                    <div class="pagination-buttons" id="pagination-buttons"></div>
                </div>
            </main>
        </div>
    </div>

    <div class="mobile-overlay" id="mobile-overlay"></div>
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
    <div class="modal-container" id="modal-container" aria-hidden="true"></div>
