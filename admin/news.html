        <div class="admin-main">
            <header class="admin-topbar">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-left">
                    <h1 class="page-title">News Management</h1>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary btn-sm" id="new-article-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        New Article
                    </button>
                    <div class="user-menu">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-info">
                            <span class="user-name" id="user-name">Admin</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="admin-content">
                <!-- News Table -->
                <div class="table-container">
                    <table class="data-table" id="news-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Published</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="news-table-body">
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton skeleton-text" style="width: 80%; height: 20px;"></div></td></tr>
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton skeleton-text" style="width: 70%; height: 20px;"></div></td></tr>
                            <tr class="skeleton-row"><td colspan="5"><div class="skeleton skeleton-text" style="width: 75%; height: 20px;"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Create/Edit Article Modal -->
    <div class="modal-container" id="article-modal" aria-hidden="true">
        <div class="modal-overlay" data-close="true"></div>
        <div class="modal modal-lg">
            <button class="modal-close" data-close="true" aria-label="Close">×</button>
            <div class="modal-header">
                <h3 class="modal-title" id="article-modal-title">New Article</h3>
            </div>
            <div class="modal-body">
                <form id="article-form" novalidate>
                    <div class="form-group">
                        <label for="article-title" class="form-label">Title *</label>
                        <input type="text" id="article-title" name="title" class="form-input" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="article-category" class="form-label">Category *</label>
                            <select id="article-category" name="category" class="form-select" required>
                                <option value="">Select category</option>
                                <option value="AI">AI</option>
                                <option value="Robotics">Robotics</option>
                                <option value="Finance">Finance</option>
                                <option value="Innovation">Innovation</option>
                                <option value="Company">Company</option>
                                <option value="General">General</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="article-status" class="form-label">Status</label>
                            <select id="article-status" name="status" class="form-select">
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="article-excerpt" class="form-label">Excerpt</label>
                        <textarea id="article-excerpt" name="excerpt" class="form-textarea" rows="2" placeholder="Brief summary of the article..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="article-content" class="form-label">Content *</label>
                        <textarea id="article-content" name="content" class="form-textarea" rows="10" required placeholder="Write your article content here..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-close="true">Cancel</button>
                <button class="btn btn-primary" id="article-save-btn">
                    <span class="btn-text">Save Article</span>
                </button>
            </div>
        </div>
    </div>

    <div class="mobile-overlay" id="mobile-overlay"></div>
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script src="/js/utils.js"></script>

    <script src="/js/modal.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/admin/js/admin-common.js"></script>
    <script src="/admin/js/news.js"></script>
