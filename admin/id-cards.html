        <div class="admin-main">
            <header class="admin-topbar">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-left">
                    <h1 class="page-title">ID Card Management</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-menu">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-info">
                            <span class="user-name" id="user-name">Admin</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="admin-content">
                <!-- ID Cards Grid -->
                <div class="id-cards-grid" id="id-cards-grid">
                    <div class="skeleton-card">
                        <div class="skeleton skeleton-image" style="aspect-ratio: 85.6/54;"></div>
                        <div class="skeleton skeleton-text" style="width: 60%; margin-top: 12px;"></div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton skeleton-image" style="aspect-ratio: 85.6/54;"></div>
                        <div class="skeleton skeleton-text" style="width: 70%; margin-top: 12px;"></div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton skeleton-image" style="aspect-ratio: 85.6/54;"></div>
                        <div class="skeleton skeleton-text" style="width: 50%; margin-top: 12px;"></div>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="5" width="20" height="14" rx="2"/>
                        <circle cx="8" cy="12" r="2"/>
                        <path d="M14 10h6M14 14h4"/>
                    </svg>
                    <h3>No ID Cards Generated</h3>
                    <p>Generate ID cards for your staff members from the Staff page.</p>
                    <a href="/admin/staff.html" class="btn btn-primary">Go to Staff</a>
                </div>

    <!-- ID Card Preview Modal -->
    <div class="modal-container" id="id-card-modal" aria-hidden="true">
        <div class="modal-overlay" data-close="true"></div>
        <div class="modal modal-lg">
            <button class="modal-close" aria-label="Close">×</button>
            <div class="modal-header">
                <h3 class="modal-title">ID Card Preview</h3>
            </div>
            <div class="modal-body">
                <div class="id-card-preview-container" id="id-card-preview"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" data-close="true">Close</button>
                <button class="btn btn-primary" id="print-card-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>

                </button>
