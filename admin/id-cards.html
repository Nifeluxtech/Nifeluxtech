    <!-- PRINT-ONLY ROOT (direct child of body, normal flow) -->
    <div id="print-root" aria-hidden="true"></div>

    <style id="print-fix">
        /* Hidden on screen */
        #print-root { display: none; }

        @media print {
            html, body {
                background: #ffffff !important;
                height: auto !important;
                overflow: visible !important;
            }

            /* Hide EVERYTHING except the print root (kills the fixed modal) */
            body > *:not(#print-root) { display: none !important; }

            #print-root,
            #print-root * {
                visibility: visible !important;
            }

            #print-root {
                display: block !important;
                position: static !important;
            }

            #print-root .idcard-print-area {
                display: block !important;
                position: static !important;
                padding: 0 !important;
            }

            #print-root .idcard-preview-item {
                display: block !important;
                margin: 0 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            /* BACK card starts on page 2 */
            #print-root .idcard-preview-item + .idcard-preview-item {
                page-break-before: always;
                break-before: page;
            }

            /* True CR80 size, exact colors */
            #print-root .idcard {
                width: 85.6mm !important;
                height: 53.98mm !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 3mm !important;
                page-break-after: auto !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #print-root .idcard-preview-label { display: none !important; }
        }
    </style>
