<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Admin Login — Nifelux Technologies</title>
    <meta name="description" content="Secure admin login for Nifelux Technologies management system.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg class="logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <linearGradient id="loginLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.7" />
                            </linearGradient>
                        </defs>
                        <path d="M20 2 L35 11 L35 29 L20 38 L5 29 L5 11 Z" fill="none" stroke="url(#loginLogoGrad)" stroke-width="2"/>
                        <path d="M20 8 L30 14 L30 26 L20 32 L10 26 L10 14 Z" fill="url(#loginLogoGrad)" opacity="0.2"/>
                        <path d="M14 20 L20 14 L26 20 L20 26 Z" fill="url(#loginLogoGrad)"/>
                    </svg>
                    <span class="logo-text">Nifelux<span class="logo-accent">.</span></span>
                </div>
                <h1 class="login-title">Admin Portal</h1>
                <p class="login-subtitle">Sign in to access the management dashboard</p>
            </div>

            <form class="login-form" id="login-form" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="admin@nifelux.com"
                        required
                        autocomplete="email"
                        autofocus
                    >
                    <span class="form-error" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                    <span class="form-error" id="password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-lg login-btn" id="login-btn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="login-footer">
                <a href="/" class="login-back">← Back to Website</a>
            </div>
        </div>

        <div class="login-branding">
            <p>Nifelux Technologies</p>
            <p class="login-tagline">Building the Future of Technology in Africa</p>
        </div>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        /**
         * NIFELUX TECHNOLOGIES - ADMIN LOGIN
         * Handles authentication with proper config loading.
         */
        const AdminLogin = (() => {
            'use strict';

            const form = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            function init() {
                // Redirect if already authenticated
                if (NifeluxAuth.isAuthenticated()) {
                    window.location.replace('/admin/dashboard.html');
                    return;
                }

                form.addEventListener('submit', handleSubmit);

                // Clear field errors while typing
                [emailInput, passwordInput].forEach(input => {
                    input.addEventListener('input', () => clearFieldError(input.id));
                });
            }

            function setLoading(isLoading) {
                if (!loginBtn) return;
                const textEl = loginBtn.querySelector('.btn-text');

                if (isLoading) {
                    loginBtn.classList.add('loading');
                    loginBtn.disabled = true;
                    if (textEl) textEl.textContent = 'Signing in...';
                } else {
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    if (textEl) textEl.textContent = 'Sign In';
                }
            }

            function showFieldError(fieldId, message) {
                const field = document.getElementById(fieldId);
                const error = document.getElementById(`${fieldId}-error`);
                if (field) field.classList.add('error');
                if (error) error.textContent = message;
            }

            function clearFieldError(fieldId) {
                const field = document.getElementById(fieldId);
                const error = document.getElementById(`${fieldId}-error`);
                if (field) field.classList.remove('error');
                if (error) error.textContent = '';
            }

            async function handleSubmit(e) {
                e.preventDefault();
                clearFieldError('email');
                clearFieldError('password');

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Client-side validation
                if (!email) { showFieldError('email', 'Email is required'); return; }
                if (!NifeluxUtils.isValidEmail(email)) { showFieldError('email', 'Please enter a valid email'); return; }
                if (!password) { showFieldError('password', 'Password is required'); return; }

                setLoading(true);

                try {
                    // ✅ CRITICAL FIX: load config BEFORE checking isConfigured()
                    await NifeluxAPI.loadConfig();

                    // ---- Demo mode (backend not configured) ----
                    if (!NifeluxAPI.isConfigured()) {
                        await NifeluxUtils.sleep(800);

                        NifeluxUtils.storage.set('nifelux_session', {
                            access_token: 'demo_token',
                            expires_at: Math.floor(Date.now() / 1000) + 3600,
                            user: {
                                id: 'demo-user',
                                email: email,
                                full_name: 'Demo Admin',
                                role: 'admin'
                            }
                        });

                        showWarning('Demo mode: Supabase is not configured. Data is simulated.');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 1200);
                        return;
                    }

                    // ---- Real login ----
                    const result = await NifeluxAuth.login(email, password);

                    if (result.success) {
                        showSuccess(`Welcome back, ${result.user.full_name || 'Admin'}!`);
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 800);
                    } else {
                        showError(result.error || 'Login failed. Please check your credentials.');
                        setLoading(false);
                    }

                } catch (error) {
                    console.error('Login error:', error);

                    if (error.type === 'network') {
                        showError('Cannot reach the server. Check your connection and try again.');
                    } else {
                        showError(error.message || 'Login failed. Please try again.');
                    }
                    setLoading(false);
                }
            }

            return { init };
        })();

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', AdminLogin.init);
        } else {
            AdminLogin.init();
        }
    </script>
</body>
</html>
