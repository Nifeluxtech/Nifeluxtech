        <div class="admin-main">
            <header class="admin-topbar">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-left">
                    <h1 class="page-title">Site Settings</h1>
                </div>
                <div class="topbar-right">
                    <div class="user-menu">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-info">
                            <span class="user-name" id="user-name">Admin</span>
                            <span class="user-role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="admin-content">
                <form id="settings-form" class="admin-form" novalidate>
                    <!-- Company Information -->
                    <div class="settings-section">
                        <h2 class="settings-section-title">Company Information</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="company-name" class="form-label">Company Name</label>
                                <input type="text" id="company-name" name="company_name" class="form-input" value="Nifelux Technologies">
                            </div>
                            <div class="form-group">
                                <label for="company-email" class="form-label">Contact Email</label>
                                <input type="email" id="company-email" name="company_email" class="form-input" value="contact@nifelux.com">
                            </div>
                            <div class="form-group">
                                <label for="company-phone" class="form-label">Phone</label>
                                <input type="tel" id="company-phone" name="company_phone" class="form-input" placeholder="+234 ...">
                            </div>
                            <div class="form-group">
                                <label for="company-address" class="form-label">Address</label>
                                <input type="text" id="company-address" name="company_address" class="form-input" value="Nigeria">
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label for="company-description" class="form-label">Company Description</label>
                                <textarea id="company-description" name="company_description" class="form-textarea" rows="3">Building the Future of Technology in Africa</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Social Media -->
                    <div class="settings-section">
                        <h2 class="settings-section-title">Social Media Links</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="social-twitter" class="form-label">Twitter / X</label>
                                <input type="url" id="social-twitter" name="social_twitter" class="form-input" placeholder="https://twitter.com/nifelux">
                            </div>
                            <div class="form-group">
                                <label for="social-linkedin" class="form-label">LinkedIn</label>
                                <input type="url" id="social-linkedin" name="social_linkedin" class="form-input" placeholder="https://linkedin.com/company/nifelux">
                            </div>
                            <div class="form-group">
                                <label for="social-github" class="form-label">GitHub</label>
                                <input type="url" id="social-github" name="social_github" class="form-input" placeholder="https://github.com/nifelux">
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="settings-section">
                        <h2 class="settings-section-title">Footer</h2>
                        <div class="form-group">
                            <label for="footer-text" class="form-label">Footer Copyright Text</label>
                            <input type="text" id="footer-text" name="footer_text" class="form-input" value="© 2026 Nifelux Technologies. All rights reserved.">
                        </div>
                    </div>

                    <!-- Save Button -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-lg" id="save-settings-btn">
                            <span class="btn-text">Save Settings</span>
                        </button>
                    </div>
                </form>
            </main>
        </div>
