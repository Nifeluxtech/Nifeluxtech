<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Nifelux Technologies</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0e1a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(0,168,255,0.08) 0%, transparent 50%),
                #0a0e1a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            padding: 24px;
            text-align: center;
        }
        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #33c0ff, #00a8ff, #0066cc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #fff;
        }
        p {
            color: #94a3b8;
            max-width: 420px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: #00a8ff;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #0090e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,168,255,0.3);
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="btn">
        Return to Homepage
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8 L13 8 M9 4 L13 8 L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
</body>
</html>
